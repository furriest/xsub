name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Тесты
        run: go vet ./... && go test -race ./...

      - name: Уязвимости в зависимостях
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true

      - name: Сборка пакетов
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Релиз на GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xsub_*.ipk
            dist/xsub-*-*
            dist/install.sh
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Репозиторий opkg для GitHub Pages
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/repo

  # Образ Docker для серверов (linux/amd64, linux/arm64): собирается из того же
  # тега, поэтому версия xsub в образе равна версии релиза. Пуш в ghcr.io —
  # только по тегу; на PR и ручном запуске сборка лишь проверяется без пуша.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Версия
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "XSUB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "XSUB_VERSION=dev" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.XSUB_VERSION }}

  pages:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Сообщение в Telegram-канал о новой версии — после публикации репозитория opkg,
  # чтобы «opkg upgrade» и кнопка «Обновить» уже видели её.
  # Нужны секреты репозитория TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID (например, @xsuby);
  # бот должен быть администратором канала с правом публиковать сообщения. Без секретов шаг пропускается.
  notify:
    if: github.ref_type == 'tag'
    needs: [build, pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Сообщение в Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "секреты TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не заданы — пропускаю"
            exit 0
          fi
          TAG="$GITHUB_REF_NAME"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          RANGE="$TAG"; [ -n "$PREV" ] && RANGE="$PREV..$TAG"
          CHANGES=$(git log --no-merges --format='• %s' "$RANGE" | head -n 30)
          TEXT=$(printf 'Вышла xsub %s\n\n%s\n\nОбновление: кнопка «Обновить» в настройках xsub или opkg update && opkg upgrade xsub\nDocker: docker compose pull && docker compose up -d\nРелиз: https://github.com/%s/releases/tag/%s' \
            "$TAG" "$CHANGES" "$REPO" "$TAG")
          jq -n --arg chat "$CHAT" --arg text "$TEXT" \
            '{chat_id: $chat, text: $text, disable_web_page_preview: true}' |
          curl -fsS -X POST -H 'Content-Type: application/json' -d @- \
            "https://api.telegram.org/bot$TOKEN/sendMessage" > /dev/null
          echo "сообщение отправлено"
