<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xsub</title>
<style>
:root{--bg:#0f1419;--panel:#171d24;--line:#26303b;--text:#d8dee6;--muted:#8a96a3;--ok:#4caf7a;--bad:#e05d5d;--warn:#d9a441;--acc:#4a9eda;--none:#2a333d}
@media (prefers-color-scheme: light){:root{--bg:#f4f6f8;--panel:#fff;--line:#dde2e8;--text:#1d2329;--muted:#5f6b77;--ok:#2e8b57;--bad:#c63b3b;--warn:#a87410;--acc:#1f6fb2;--none:#e3e7ec}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 8px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 260px}
button,select{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer}
select{background:var(--bg)}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:wait}
button.cur,button.cur:hover,button.cur:disabled{border-color:var(--ok);color:var(--ok);opacity:1;cursor:default}
#updBtn:disabled{cursor:not-allowed}
input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;min-width:0}
textarea{width:100%;min-height:300px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
label{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
label.check{flex-direction:row;align-items:center;gap:8px;flex:1 1 100%}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.big{font-size:17px;font-weight:600}
.err{white-space:pre-wrap;color:var(--bad)}
.note{white-space:pre-wrap;color:var(--warn)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
tr.active td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav.tabs button.on,.subtabs button.on{border-color:var(--acc);color:var(--acc)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
pre{margin:0;max-height:420px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.scroll{overflow-x:auto}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.card .row input{flex:1 1 200px}
.card .row input.n{flex:1 1 140px;max-width:220px}
/* Узлы: служебные столбцы шириной по содержимому, «Состояние» забирает весь остаток
   и переносится в нём. Иначе длинный текст ошибки растягивал её за счёт соседей,
   и адрес узла с «проверен: N мин назад» ломались на две строки. */
#nodesTable td.lat,#nodesTable td.rel,#nodesTable td.btn{width:1%;white-space:nowrap}
#nodesTable td.rel{min-width:170px}
#nodesTable td.state{width:100%;overflow-wrap:anywhere}
#nodesTable .addr,#nodesTable .when{white-space:nowrap}
#nodesTable th.sort{cursor:pointer;user-select:none;white-space:nowrap}
#nodesTable th.sort:hover{color:var(--text)}
#nodesTable th .arr{display:inline-block;width:12px;margin-left:3px;font-style:normal;color:var(--acc)}
.strip{display:flex;gap:1px;height:14px;margin-top:6px}
.strip i{flex:1;border-radius:2px;background:var(--none)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;margin-left:6px}
.banner{border:1px solid var(--acc);border-radius:8px;padding:10px;margin-bottom:12px}
code{font:12px ui-monospace,Menlo,Consolas,monospace}
.hide{display:none}
#msg{min-height:1.4em;margin-top:8px}
#nodesTable td:first-child{min-width:240px} /* чтобы имена вроде «Швеция N1 (YouTube без рекламы)» умещались в строку */
/* форма настроек: пары «подпись — поле», две пары в строке */
.form{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr);gap:10px 14px;align-items:start}
.form .fh{grid-column:1/-1;margin:10px 0 0}
.form .fh:first-child{margin-top:0}
.form .fl{display:block;flex:none;justify-self:end;text-align:right;padding-top:7px;max-width:240px;color:var(--text)}
.form .fv{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.form .fv.wide{grid-column:2/-1}
.form .fv.full{grid-column:1/-1}
.form .fv input:not([type=checkbox]),.form .fv select{width:100%;max-width:260px}
.form .fv input.num{width:90px}
.form .fv textarea{width:100%;min-height:70px}
.form .fv input[type=checkbox]{width:18px;height:18px;margin:7px 0}
.form .unit{color:var(--muted)}
.form .pwform{display:contents}
.form .hint{flex-basis:100%;color:var(--muted);font-size:12px;line-height:1.35}
@media (max-width:760px){
  .form{grid-template-columns:max-content minmax(0,1fr)}
  .form .fl{max-width:170px}
}
@media (max-width:440px){
  .form{grid-template-columns:minmax(0,1fr)}
  .form .fl{justify-self:start;text-align:left;padding-top:4px;max-width:none;margin-bottom:-6px}
  .form .fv.wide{grid-column:1/-1}
  .form .fl-empty{display:none}
}

@media (max-width:640px){
  #nodesTable thead{display:none}
  #nodesTable tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  #nodesTable td{display:block;border:0;padding:2px 6px}
  /* столбцы идут друг под другом — ширины и запрет переносов тут только мешают */
  #nodesTable td.lat,#nodesTable td.rel,#nodesTable td.btn,#nodesTable td.state{width:auto;white-space:normal}
  #nodesTable td:first-child,#nodesTable td.rel{min-width:0}
  #nodesTable .addr,#nodesTable .when{white-space:normal}
}
</style>
</head>
<body>
<main>
<header>
  <h1>xsub <span class="muted" id="ver" style="font-size:13px;font-weight:400"></span></h1>
  <span class="grow"></span>
  <select id="lang" onchange="setLang(this.value)"><option value="ru">Русский</option><option value="en">English</option></select>
</header>
<div id="updBanner" class="banner hide"></div>

<nav class="tabs" id="tabs"></nav>

<!-- Обзор -->
<div data-tab="overview">
  <section id="diagBox" class="hide">
    <h2 data-i18n="diagFix"></h2>
    <div id="diagWarn"></div>
  </section>
  <section>
    <div id="targets"></div>
    <div class="row" style="margin-top:10px">
      <button data-i18n="btnAuto" onclick="act('/api/auto','msgAuto')"></button>
      <button data-i18n="btnCheck" onclick="act('/api/check','msgCheck')"></button>
      <button data-i18n="btnSubs" onclick="refreshSubs()"></button>
      <button data-i18n="btnGeo" onclick="act('/api/geo/refresh','msgGeo')"></button>
    </div>
    <div id="msg" class="muted"></div>
    <div id="errs" class="err"></div>
    <div id="warns" class="note"></div>
    <div id="sum" class="muted" style="margin-top:6px"></div>
  </section>
  <section>
    <h2 data-i18n="events"></h2>
    <div id="events" class="muted"></div>
  </section>
</div>

<!-- Подписки -->
<div data-tab="subs" class="hide">
  <section>
    <h2 data-i18n="tabSubs"></h2>
    <div id="subs"></div>
    <div class="row" style="margin-top:8px">
      <button data-i18n="addSub" onclick="addSub()"></button>
      <button class="primary" id="ssave" data-i18n="saveSubs" onclick="saveSubs()"></button>
      <span id="smsg" class="muted"></span>
    </div>
    <p class="muted" data-i18n="subsHint"></p>
  </section>
  <section>
    <h2 data-i18n="fbTitle"></h2>
    <p class="muted" data-i18n="fbHint"></p>
    <div id="fbs"></div>
    <div id="fbImports"></div>
    <datalist id="ifaceList"></datalist>
    <div class="row" style="margin-top:8px">
      <button data-i18n="addFb" onclick="addFb()"></button>
      <button data-i18n="addFbIface" onclick="addFbIface()"></button>
      <button class="primary" id="fbsave" data-i18n="saveFb" onclick="saveFbs()"></button>
      <span id="fbmsg" class="muted"></span>
    </div>
  </section>
</div>

<!-- Узлы -->
<div data-tab="nodes" class="hide">
  <section>
    <h2 data-i18n="tabNodes"></h2>
    <div class="scroll"><table id="nodesTable">
      <thead><tr>
        <th class="sort" data-i18n-title="sortHint" onclick="sortBy('name')"><span data-i18n="thNode"></span><i class="arr" id="arrName"></i></th>
        <th class="lat sort" data-i18n-title="sortHint" onclick="sortBy('lat')"><span data-i18n="thLat"></span><i class="arr" id="arrLat"></i></th>
        <th class="rel sort" data-i18n-title="sortHint" onclick="sortBy('rel')"><span data-i18n="thRel"></span><i class="arr" id="arrRel"></i></th>
        <th class="state" data-i18n="thState"></th><th class="btn"></th>
      </tr></thead>
      <tbody id="nodes"></tbody>
    </table></div>
    <p class="muted" data-i18n="nodesHint"></p>
  </section>
</div>

<!-- Списки и группы -->
<div data-tab="lists" class="hide">
  <section>
    <div class="subtabs" id="listTabs"></div>
    <p class="muted" data-i18n="listHint"></p>
    <textarea id="list" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="lsave" data-i18n="saveApply" onclick="saveList()"></button>
      <span id="lmsg" class="muted"></span>
    </div>
  </section>
  <section>
    <h2 data-i18n="groups"></h2>
    <p class="muted" data-i18n="groupsHint"></p>
    <div id="groups"></div>
    <div class="row" style="margin-top:8px">
      <button data-i18n="addGroup" onclick="addGroup()"></button>
      <button class="primary" id="gsave" data-i18n="saveGroups" onclick="saveGroups()"></button>
      <span id="gmsg" class="muted"></span>
    </div>
  </section>
</div>

<!-- Проверка сайта -->
<div data-tab="route" class="hide">
  <section>
    <h2 data-i18n="routeTitle"></h2>
    <div class="row">
      <input id="rq" class="grow" data-i18n-ph="routePh" onkeydown="if(event.key==='Enter')checkRoute()">
      <button class="primary" data-i18n="routeBtn" onclick="checkRoute()"></button>
    </div>
    <div id="rres" style="margin-top:12px"></div>
  </section>
</div>

<!-- Настройки -->
<div data-tab="settings" class="hide">
  <section>
    <div class="form">
      <h2 class="fh" data-i18n="setMain"></h2>
      <label class="fl" for="s_sub_interval_hours" data-i18n="sInterval"></label>
      <div class="fv"><input id="s_sub_interval_hours" class="num" type="number" min="1" max="168"><span class="unit" data-i18n="uHours"></span></div>
      <label class="fl" for="s_user_agent" data-i18n="sUA"></label>
      <div class="fv"><input id="s_user_agent" name="xsub_user_agent" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-form-type="other"></div>
      <label class="fl" for="s_max_nodes" data-i18n="sMax"></label>
      <div class="fv"><input id="s_max_nodes" class="num" type="number" min="1" max="500"></div>
      <h3 class="fh" data-i18n="setWatch"></h3>
      <label class="fl" for="s_w_enabled" data-i18n="sWEnabled"></label>
      <div class="fv"><input type="checkbox" id="s_w_enabled"></div>
      <label class="fl" for="s_w_interval_sec" data-i18n="sWInterval"></label>
      <div class="fv"><input id="s_w_interval_sec" class="num" type="number" min="15" max="3600"><span class="unit" data-i18n="uSec"></span></div>
      <label class="fl" for="s_w_fails_to_switch" data-i18n="sWFails"></label>
      <div class="fv"><input id="s_w_fails_to_switch" class="num" type="number" min="1" max="10"></div>
      <label class="fl" for="s_w_switch_faster_ms" data-i18n="sWFaster"></label>
      <div class="fv"><input id="s_w_switch_faster_ms" class="num" type="number" min="0" max="10000"><span class="unit" data-i18n="uMs"></span><small class="hint" data-i18n="hFaster"></small></div>
      <label class="fl" for="s_w_background_cycle_min" data-i18n="sWBg"></label>
      <div class="fv"><input id="s_w_background_cycle_min" class="num" type="number" min="0" max="1440"><span class="unit" data-i18n="uMin"></span><small class="hint" data-i18n="hBg"></small></div>
      <label class="fl" for="s_w_test_kb" data-i18n="sWSize"></label>
      <div class="fv"><input id="s_w_test_kb" class="num" type="number" min="8" max="1024"><span class="unit" data-i18n="uKB"></span><small class="hint" data-i18n="hSize"></small></div>
      <label class="fl" for="s_w_restart_xray" data-i18n="sWRestart"></label>
      <div class="fv"><input type="checkbox" id="s_w_restart_xray"><small class="hint" data-i18n="hRestart"></small></div>
      <label class="fl" for="s_w_check_urls" data-i18n="sWUrls"></label>
      <div class="fv wide"><textarea id="s_w_check_urls" style="min-height:70px"></textarea><small class="hint" data-i18n="hUrls"></small></div>
      <h3 class="fh">Telegram</h3>
      <label class="fl" for="s_tg_token" data-i18n="sTgToken"></label>
      <div class="fv"><input id="s_tg_token" name="xsub_tg_token" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-form-type="other"></div>
      <label class="fl" for="s_tg_chat_id" data-i18n="sTgChat"></label>
      <div class="fv"><input id="s_tg_chat_id" name="xsub_tg_chat" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-form-type="other"></div>
      <label class="fl" for="s_tg_expire_days" data-i18n="sTgDays"></label>
      <div class="fv"><input id="s_tg_expire_days" class="num" type="number" min="0" max="60"><span class="unit" data-i18n="uDays"></span><small class="hint" data-i18n="hTgDays"></small></div>
      <label class="fl" for="s_tg_traffic_pct" data-i18n="sTgPct"></label>
      <div class="fv"><input id="s_tg_traffic_pct" class="num" type="number" min="0" max="100"><span class="unit" data-i18n="uPct"></span><small class="hint" data-i18n="hTgPct"></small></div>
      <label class="fl" for="s_tg_on_switch" data-i18n="sTgSwitch"></label>
      <div class="fv"><input type="checkbox" id="s_tg_on_switch"></div>
      <label class="fl" for="s_tg_on_update" data-i18n="sTgUpdate"></label>
      <div class="fv"><input type="checkbox" id="s_tg_on_update"></div>
      <span class="fl-empty"></span><div class="fv wide"><div class="row"><button data-i18n="sTgTest" onclick="tgTest()"></button><span id="tgmsg" class="muted"></span></div><small class="hint" data-i18n="sTgHint"></small></div>
      <h3 class="fh" data-i18n="setAccess"></h3>
      <label class="fl" for="s_password" data-i18n="sPass"></label>
      <div class="fv"><form class="pwform" autocomplete="off" onsubmit="return false"><input type="text" name="username" value="admin" autocomplete="username" hidden><input id="s_password" name="xsub_password" type="password" autocomplete="new-password"></form><small class="hint" data-i18n="hPass"></small></div>
      <label class="fl" for="s_log_file" data-i18n="sLog"></label>
      <div class="fv"><select id="s_log_file"><option value="/tmp/xsub.log" data-i18n="logTmp"></option><option value="" data-i18n="logMem"></option><option value="/opt/var/log/xsub.log" data-i18n="logDisk"></option></select></div>
      <label class="fl" for="s_ui_allow_wan" data-i18n="sWan"></label>
      <div class="fv"><input type="checkbox" id="s_ui_allow_wan"><small class="hint" data-i18n="hWan"></small></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="setsave" data-i18n="saveSettings" onclick="saveSettings()"></button>
      <span id="setmsg" class="muted"></span>
    </div>
  </section>
  <section>
    <h2 data-i18n="setBackup"></h2>
    <p class="muted" data-i18n="backupHint"></p>
    <div class="row">
      <a href="/api/backup"><button data-i18n="backupBtn"></button></a>
      <label class="check" style="flex:0 1 auto"><input type="file" id="restoreFile" accept=".json,application/json" onchange="restore(this)"><span data-i18n="restoreBtn"></span></label>
      <span id="bmsg" class="muted"></span>
    </div>
  </section>
  <section>
    <h2 data-i18n="diagTitle"></h2>
    <p class="muted" data-i18n="diagHint"></p>
    <div id="diagAll"></div>
    <div class="row" style="margin-top:8px"><button data-i18n="diagRecheck" onclick="loadDiag()"></button></div>
  </section>
  <section>
    <h2 data-i18n="setUpdate"></h2>
    <div class="row">
      <span id="uver" class="grow"></span>
      <button id="updCheckBtn" data-i18n="updCheck" onclick="updCheck()"></button>
      <button class="primary" id="updBtn" data-i18n="updBtn" onclick="doUpdate()"></button>
    </div>
    <pre id="ulog" class="muted" style="margin-top:8px"></pre>
  </section>
</div>

<!-- Журнал -->
<div data-tab="log" class="hide">
  <section>
    <h2 data-i18n="tabLog"></h2>
    <pre id="log"></pre>
  </section>
</div>
</main>

<script>
const I18N = {
ru: {
  tabOverview:'Обзор', tabSubs:'Подписки', tabNodes:'Узлы', tabLists:'Списки и группы', tabRoute:'Проверка сайта', tabSettings:'Настройки', tabLog:'Журнал',
  btnAuto:'Автовыбор', btnCheck:'Проверить узлы', btnSubs:'Обновить подписки', btnGeo:'Обновить geo и списки',

  mainTarget:'Основной трафик VPN', via:'идёт через', noNode:'узел не выбран — автовыбор Xray', noNodes:'нет узлов — добавьте подписку',

  subsHint:'Подходят ссылки vless/vmess/trojan/ss/hysteria2/wireguard/socks/http (списком или в base64), Clash/mihomo YAML, sing-box JSON и JSON Xray. Фильтр — регулярное выражение по имени узла, например (?i)Россия|Осталось. Информационные строки панелей пропускаются сами.',
  phName:'Название', phUrl:'https://… ссылка на подписку', phEx:'Исключить узлы (регулярное выражение)', phIn:'Только узлы (необязательно)', phUA:'User-Agent (необяз.)',

  fbImportTitle:'Перенести из конфигов Xray', fbImportHint:'Outbound скопируется в xsub; исходный файл XKeen не меняется — после переноса его можно удалить оттуда.', fbImported:'уже перенесён', fbLegacy:'сейчас запасной', fbImportBtn:'Перенести',

let lang = 'ru';
try { lang = localStorage.getItem('xsub-lang') || ((navigator.language || 'ru').startsWith('ru') ? 'ru' : 'en'); } catch (e) {}
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.ru[k] || k;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = () => lang === 'ru' ? 'ru-RU' : 'en-GB';
const ago = x => {
  if (!x || x.startsWith('0001')) return t('never');
  const m = Math.floor((Date.now() - new Date(x).getTime()) / 60000);
  return m < 1 ? t('justNow') : m < 120 ? m + ' ' + t('agoMin') : Math.floor(m / 60) + ' ' + t('agoH');
};
const when = x => (!x || x.startsWith('0001')) ? t('never') : new Date(x).toLocaleString(loc());
const TABS = ['overview','subs','nodes','lists','route','settings','log'];
const TABKEY = {overview:'tabOverview',subs:'tabSubs',nodes:'tabNodes',lists:'tabLists',route:'tabRoute',settings:'tabSettings',log:'tabLog'};
let curTab = 'overview', S = null;

function applyI18n() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(e => e.title = t(e.dataset.i18nTitle));
  $('tabs').innerHTML = TABS.map(k => '<button class="' + (k === curTab ? 'on' : '') + '" onclick="tab(\'' + k + '\')">' + t(TABKEY[k]) + '</button>').join('');
}
function setLang(l) { lang = l; try { localStorage.setItem('xsub-lang', l); } catch (e) {} applyI18n(); render(); renderLists(); renderSubs(); renderFbs(); renderGroups(); }
function tab(k) {
  if (k !== 'lists' && dirty && !confirm(t('unsaved'))) return;
  if (k !== 'lists') dirty = false;
  curTab = k;
  document.querySelectorAll('[data-tab]').forEach(e => e.classList.toggle('hide', e.dataset.tab !== k));
  applyI18n();
  if (k === 'settings') { loadSettings(); loadDiag(); }
}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'X-XSub':'1'}, body});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function setMsg(el, cls, text) { $(el).className = cls; $(el).textContent = text; }

async function act(url, key) {
  document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = true);
  setMsg('msg', 'muted', t(key));
  try { await post(url); setMsg('msg', 'ok', t('done')); } catch (e) { setMsg('msg', 'bad', e.message); }
  document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = false);
  load();
}

// Обновление подписок идёт в фоне: сервер отвечает сразу, а «готово» показываем,
// когда статус (опрос каждые 10 с) сообщит, что флаг refreshing снят. «Готово»
// допустимо только после того, как флаг хоть раз был поднят: сразу после POST
// он может быть ещё не выставлен, а сторож уже начал обновление.
let refreshPolls = 0, refreshSeen = false;
async function refreshSubs() {
  document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = true);
  setMsg('msg', 'muted', t('msgSubs'));
  try { await post('/api/sub/refresh'); refreshPolls = 60; load(); }
  catch (e) {
    setMsg('msg', 'bad', e.message);
    document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = false);
  }
}
function watchRefresh() {
  if (refreshPolls <= 0 || !S) return;
  refreshPolls--;
  if (S.refreshing) refreshSeen = true;
  const done = refreshSeen && !S.refreshing;
  if (done || refreshPolls === 0) {
    refreshPolls = 0;
    refreshSeen = false;
    setMsg('msg', done ? 'ok' : 'muted', t(done ? 'done' : 'msgSubsLong'));
    document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = false);
  }
}

// ---------- сортировка таблицы узлов ----------
// null — порядок как в конфиге: сначала узлы подписок, потом резервы.
let nodeSort = null;
try { nodeSort = JSON.parse(localStorage.getItem('xsub-node-sort')) || null; } catch (e) {}

const SORT_KEY = {
  name: n => (n.name || '').toLowerCase(),
  lat:  n => n.latency_ms,
  rel:  n => (n.stats || {}).score,
};
// Узлы без данных всегда внизу, в какую бы сторону ни сортировали: иначе при
// обратном порядке наверх всплывают непроверенные, а это самое бесполезное.
const SORT_MISSING = {
  name: () => false,
  lat:  n => !(n.latency_ms > 0),
  rel:  n => { const st = n.stats || {}; return !((st.ok || 0) + (st.fail || 0)); },
};
// По надёжности осмысленно начинать с лучших, по остальным — с меньшего.
const SORT_DESC_FIRST = {name: false, lat: false, rel: true};

function sortBy(by) {
  if (!nodeSort || nodeSort.by !== by) nodeSort = {by: by, desc: SORT_DESC_FIRST[by]};
  else if (nodeSort.desc === SORT_DESC_FIRST[by]) nodeSort = {by: by, desc: !nodeSort.desc};
  else nodeSort = null; // третий щелчок возвращает порядок как в конфиге
  try { localStorage.setItem('xsub-node-sort', JSON.stringify(nodeSort)); } catch (e) {}
  render();
}

function sortNodes(list) {
  if (!nodeSort || !SORT_KEY[nodeSort.by]) return list;
  const key = SORT_KEY[nodeSort.by], miss = SORT_MISSING[nodeSort.by], sign = nodeSort.desc ? -1 : 1;
  return list.slice().sort((a, b) => {
    const am = miss(a), bm = miss(b);
    if (am !== bm) return am ? 1 : -1;
    if (am) return 0;
    const x = key(a), y = key(b);
    return x < y ? -sign : x > y ? sign : 0;
  });
}

function renderSortArrows() {
  const ids = {name: 'arrName', lat: 'arrLat', rel: 'arrRel'};
  for (const k in ids) $(ids[k]).textContent = nodeSort && nodeSort.by === k ? (nodeSort.desc ? '▼' : '▲') : '';
}

function strip(slots) {
  const now = Date.now(), slot = 30 * 60 * 1000, start = Math.floor(now / slot) * slot - 47 * slot;
  const map = {}; (slots || []).forEach(s => map[s.t * 1000] = s);
  let h = '<div class="strip">';
  for (let i = 0; i < 48; i++) {
    const ts = start + i * slot, s = map[ts];
    let c = 'var(--none)', title = new Date(ts).toLocaleTimeString(loc(), {hour:'2-digit', minute:'2-digit'});
    if (s) {
      const r = s.ok / (s.ok + s.fail);
      c = r >= 0.99 ? 'var(--ok)' : r >= 0.5 ? 'var(--warn)' : 'var(--bad)';
      title += ' — ' + s.ok + '/' + (s.ok + s.fail);
    }
    h += '<i style="background:' + c + '" title="' + esc(title) + '"></i>';
  }
  return h + '</div>';
}

function render() {
  if (!S) return;
  const s = S;
  $('ver').textContent = s.version || '';

  const ts = s.targets || [];

    const avail = ts.filter(tg => n.fallback || !tg.tags || tg.tags.includes(n.tag));
    const bad = n.bad_until && new Date(n.bad_until).getTime() > now;
    const lat = n.latency_ms > 0 ? n.latency_ms + ' ms' : (n.latency_ms < 0 ? '<span class="bad">—</span>' : '<span class="muted">·</span>');
    const st = n.stats || {};

      '<div class="muted when">' + t('lastTest') + ': ' + ago(st.last_test) + '</div>' : '<span class="muted">·</span>';

    const choices = avail.filter(tg => tg.active !== n.tag);
    let btn = activeIn.map(tg => '<button class="cur" disabled>' + t('active') + (ts.length > 1 ? ' — ' + esc(tgName(tg)) : '') + '</button>').join('<br>');
    if (btn && choices.length) btn += '<br>';
    if (choices.length === 1) btn += '<button onclick="pick(\'' + esc(choices[0].id) + '\',\'' + esc(n.tag) + '\')">' + t('select') + '</button>';
    else if (choices.length > 1) btn += '<select id="sel_' + esc(n.tag) + '">' + choices.map(tg => '<option value="' + esc(tg.id) + '">' + esc(tgName(tg)) + '</option>').join('') + '</select> <button onclick="pick($(\'sel_' + esc(n.tag) + '\').value,\'' + esc(n.tag) + '\')">' + t('select') + '</button>';
    return '<tr class="' + (activeIn.length ? 'active' : '') + '"><td>' + esc(n.name) + (n.fallback ? '<span class="badge warn">' + t('fallback') + '</span>' : '') + '<div class="muted addr">' + esc(n.proto) + ' · ' + esc(n.address) + '</div></td><td class="lat">' + lat +
      '</td><td class="rel">' + rel + '</td><td class="state">' + state + '</td><td class="btn">' + btn + '</td></tr>';
  }).join('') || '<tr><td colspan="5" class="muted">' + t('noNodes') + '</td></tr>';
  $('log').textContent = (s.log || []).slice().reverse().join('\n');
  if (!subsDirty && !$('subs').contains(document.activeElement)) renderSubs();
  if (!$('fbs').contains(document.activeElement)) renderFbs();
  if (!groupsDirty && !$('groups').contains(document.activeElement)) { groups = JSON.parse(JSON.stringify(s.groups || [])); renderGroups(); }
  renderListTabs();
}

function newerThan(a, b) {
  const pa = (a || '').match(/(\d+)\.(\d+)\.(\d+)/), pb = (b || '').match(/(\d+)\.(\d+)\.(\d+)/);
  if (!pa || !pb) return false;
  for (let i = 1; i <= 3; i++) { if (+pa[i] !== +pb[i]) return +pb[i] > +pa[i]; }
  return false;
}

async function pick(target, tag) {
  setMsg('msg', 'muted', '…');
  try { await post('/api/select', JSON.stringify({Target: target, Tag: tag})); setMsg('msg', 'ok', t('done')); }
  catch (e) { setMsg('msg', 'bad', e.message); }
  load();
}

async function load() {
  try { S = await (await fetch('/api/status')).json(); } catch (e) { return; }
  watchRefresh();
  render();
}

// ---------- подписки ----------
let subs = [], subsDirty = false;
const gb = n => (n / 1073741824).toFixed(n < 10737418240 ? 2 : 1);
function subState(st) {
  if (!st) return '<span class="muted">' + t('notYet') + '</span>';
  let parts = [t('nodesN') + ': ' + st.nodes, t('updated') + ': ' + when(st.at) + (st.cached ? ' (' + t('cached') + ')' : '')];
  if (st.info) {
    const used = st.info.upload + st.info.download;
    parts.push(t('traffic') + ': ' + gb(used) + (st.info.total ? ' ' + t('of') + ' ' + gb(st.info.total) : '') + ' ' + t('gb'));
    if (st.info.expire) parts.push(t('until') + ' ' + new Date(st.info.expire * 1000).toLocaleDateString(loc()));
  }
  let h = '<span class="muted">' + parts.map(esc).join(' · ') + '</span>';
  if (st.err) h += '<div class="bad">' + esc(st.err) + '</div>';
  (st.warns || []).forEach(w => h += '<div class="muted">' + esc(w) + '</div>');
  return h;
}
function renderSubs() {
  const states = (S && S.subs) || [];
  $('subs').innerHTML = subs.map((s, i) => {
    const st = (states.find(x => x.url === s.url) || {}).state;
    const inp = (k, ph, cls) => '<input class="' + (cls || '') + '" placeholder="' + esc(t(ph)) + '" value="' + esc(s[k] || '') + '" oninput="subs[' + i + '].' + k + '=this.value;subsDirty=true">';
    return '<div class="card"><div class="row">' + inp('name', 'phName', 'n') + inp('url', 'phUrl') +
      '<button onclick="subs.splice(' + i + ',1);subsDirty=true;renderSubs()">' + t('del') + '</button></div>' +
      '<div class="row" style="margin-top:6px">' + inp('exclude', 'phEx') + inp('include', 'phIn') + inp('user_agent', 'phUA', 'n') + '</div>' +
      '<div style="margin-top:6px">' + subState(st) + '</div></div>';
  }).join('') || '<div class="muted">' + t('noSubs') + '</div>';
}
function addSub() { subs.push({name: '', url: ''}); subsDirty = true; renderSubs(); }
async function saveSubs() {
  $('ssave').disabled = true; setMsg('smsg', 'muted', t('saving'));
  try {
    await post('/api/subs', JSON.stringify(subs.filter(s => s.url.trim() !== '')));
    subsDirty = false; setMsg('smsg', 'ok', t('saved'));
    subs = await (await fetch('/api/subs')).json() || []; renderSubs();
  } catch (e) { setMsg('smsg', 'bad', e.message); }
  $('ssave').disabled = false; setTimeout(load, 3000);
}

// ---------- окружение ----------
let DIAG = [];
function diagItem(x) {
  const cls = {ok: 'ok', info: 'muted', warn: 'warn', bad: 'bad'}[x.level] || 'muted', mark = {ok: '✓', info: 'i', warn: '!', bad: '✗'}[x.level] || '·';
  return '<div style="margin-bottom:6px"><span class="' + cls + '">' + mark + '</span> ' + esc(x.text) +
    (x.fix ? '<div class="muted" style="margin-left:16px">' + esc(t('diagCmd')) + ': <code>' + esc(x.fix) + '</code></div>' : '') + '</div>';
}
function renderDiag() {
  const probs = DIAG.filter(x => x.level === 'bad' || x.level === 'warn');
  $('diagBox').classList.toggle('hide', !probs.length);
  $('diagWarn').innerHTML = probs.map(diagItem).join('');
  $('diagAll').innerHTML = DIAG.map(diagItem).join('');
}
async function loadDiag() {
  try { DIAG = await (await fetch('/api/diag')).json() || []; } catch (e) { return; }
  renderDiag();
}

// ---------- резервные узлы ----------
let FB = {fallbacks: [], imports: []}, fbs = [];
async function loadFbs() {
  try { FB = await (await fetch('/api/fallbacks')).json(); } catch (e) { return; }
  fbs = (FB.fallbacks || []).map(f => ({name: f.name, link: f.link || '', iface: f.interface || '', isIface: !!f.interface,
    outbound: f.outbound, tag: f.tag, summary: f.summary, err: f.err, warn: f.warn}));
  $('ifaceList').innerHTML = (FB.interfaces || []).map(i =>
    '<option value="' + esc(i.name) + '">' + esc([i.addr, i.up ? '' : t('fbIfaceDown')].filter(Boolean).join(' · ')) + '</option>').join('');
  renderFbs();
}
function fbState(f) {
  if (f.err) return '<div class="bad">' + esc(f.err) + '</div>';
  const warn = f.warn ? '<div class="warn">' + esc(f.warn) + '</div>' : '';
  if (warn) return warn + fbStats(f);
  return fbStats(f);
}
function fbStats(f) {
  const n = ((S && S.fallbacks) || []).find(x => x.tag === f.tag);
  if (!n) return '';
  const st = n.stats || {}, tot = (st.ok || 0) + (st.fail || 0);
  let h = f.outbound ? '' : '<span class="muted">' + esc(f.summary || '') + '</span> · ';
  if (tot) h += '<span class="' + (st.score >= 0.9 ? 'ok' : st.score >= 0.6 ? 'warn' : 'bad') + '">' + Math.round(st.score * 100) + '%</span> <span class="muted">(' + st.ok + '/' + tot + ', ' + t('lastTest') + ': ' + ago(st.last_test) + ')</span>';
  if (n.last_err) h += '<div class="muted">' + esc(n.last_err) + '</div>';
  return h;
}
function renderFbs() {
  $('fbs').innerHTML = fbs.map((f, i) => {
    const nm = '<input class="n" placeholder="' + esc(t('phName')) + '" value="' + esc(f.name || '') + '" oninput="fbs[' + i + '].name=this.value">';
    const body = f.outbound ? '<span class="grow muted">' + esc(t('fbOutbound')) + (f.summary ? ': ' + esc(f.summary) : '') + '</span>'
      : f.isIface
      ? '<input list="ifaceList" autocomplete="off" spellcheck="false" placeholder="' + esc(t('phFbIface')) + '" value="' + esc(f.iface || '') + '" oninput="fbs[' + i + '].iface=this.value">'
      : '<input autocomplete="off" spellcheck="false" data-1p-ignore data-lpignore="true" placeholder="' + esc(t('phFbLink')) + '" value="' + esc(f.link || '') + '" oninput="fbs[' + i + '].link=this.value">';
    const mv = (d, k) => '<button ' + ((i + d < 0 || i + d >= fbs.length) ? 'disabled ' : '') + 'onclick="moveFb(' + i + ',' + d + ')" title="' + esc(t(k)) + '">' + (d < 0 ? '↑' : '↓') + '</button>';
    return '<div class="card"><div class="row"><span class="muted">' + (i + 1) + '.</span>' + nm + body + mv(-1, 'up') + mv(1, 'downBtn') +
      '<button onclick="fbs.splice(' + i + ',1);renderFbs()">' + t('del') + '</button></div>' +
      '<div style="margin-top:6px">' + fbState(f) + '</div></div>';
  }).join('') || '<div class="muted">' + t('noFbs') + '</div>';
  const imp = (FB.imports || []);
  $('fbImports').innerHTML = imp.length ? '<h3>' + esc(t('fbImportTitle')) + '</h3><p class="muted">' + esc(t('fbImportHint')) + '</p>' +
    imp.map(c => '<div class="row" style="margin-bottom:6px"><code>' + esc(c.tag) + '</code><span class="muted">' + esc(c.summary) + '</span>' +
      (c.legacy ? '<span class="badge warn">' + esc(t('fbLegacy')) + '</span>' : '') +
      (c.imported ? '<span class="badge ok">' + esc(t('fbImported')) + '</span>' : '<button onclick="importFb(\'' + esc(c.tag) + '\')">' + esc(t('fbImportBtn')) + '</button>') + '</div>').join('') : '';
}
function moveFb(i, d) { const x = fbs[i]; fbs[i] = fbs[i + d]; fbs[i + d] = x; renderFbs(); }
function addFb() { fbs.push({name: '', link: ''}); renderFbs(); }
function addFbIface() { fbs.push({name: '', link: '', iface: '', isIface: true}); renderFbs(); }
function importFb(tag) { saveFbs(fbs.concat([{name: tag, import: tag}])); }
async function saveFbs(list) {
  list = (list || fbs).filter(f => f.import || f.outbound || (f.iface || '').trim() !== '' || (f.link || '').trim() !== '')
    .map(f => f.import ? {name: f.name, import: f.import}
      : f.outbound ? {name: f.name, outbound: f.outbound}
      : (f.iface || '').trim() !== '' ? {name: f.name, interface: f.iface.trim()}
      : {name: f.name, link: f.link});
  $('fbsave').disabled = true; setMsg('fbmsg', 'muted', t('applying'));
  try { await post('/api/fallbacks', JSON.stringify(list)); setMsg('fbmsg', 'ok', t('applied')); await loadFbs(); }
  catch (e) { setMsg('fbmsg', 'bad', e.message); }
  $('fbsave').disabled = false; load();
}

// ---------- списки ----------
let curList = 'vpn', listText = {}, dirty = false;
function listNames() {
  const g = ((S && S.groups) || []).map(x => ({id: x.id, name: x.name}));
  return [{id: 'vpn', name: t('listVPN')}, {id: 'direct', name: t('listDirect')}].concat(g);
}
function renderListTabs() {
  const names = listNames();
  if (!names.find(x => x.id === curList)) { curList = 'vpn'; showList(); }
  $('listTabs').innerHTML = names.map(x => '<button class="' + (x.id === curList ? 'on' : '') + '" onclick="openList(\'' + esc(x.id) + '\')">' + esc(x.name) + '</button>').join('');
}
function renderLists() { renderListTabs(); }
async function fetchList(id) { listText[id] = await (await fetch('/api/list?name=' + encodeURIComponent(id))).text(); }
async function openList(id) {
  if (dirty && !confirm(t('unsaved'))) return;
  curList = id; dirty = false;
  if (listText[id] === undefined) await fetchList(id);
  showList(); renderListTabs();
}
function showList() { $('list').value = listText[curList] || ''; setMsg('lmsg', 'muted', ''); }
$('list').addEventListener('input', () => dirty = true);
async function saveList() {
  $('lsave').disabled = true; setMsg('lmsg', 'muted', t('applying'));
  try {
    await post('/api/list?name=' + encodeURIComponent(curList), $('list').value);
    listText[curList] = $('list').value; dirty = false; setMsg('lmsg', 'ok', t('applied'));
  } catch (e) { setMsg('lmsg', 'bad', e.message); }
  $('lsave').disabled = false; load();
}

// ---------- группы ----------
let groups = [], groupsDirty = false;
function renderGroups() {
  const ts = (S && S.targets) || [], nodes = (S && S.nodes) || [];
  $('groups').innerHTML = groups.map((g, i) => {
    let cnt = '';
    if (g.filter !== undefined) {
      try { const re = new RegExp(g.filter.replace(/^\(\?i\)/, ''), g.filter.startsWith('(?i)') ? 'i' : ''); cnt = nodes.filter(n => re.test(n.name)).length; } catch (e) { cnt = '?'; }
    }
    return '<div class="card"><div class="row">' +
      '<input class="n" placeholder="' + esc(t('phGName')) + '" value="' + esc(g.name) + '" oninput="groups[' + i + '].name=this.value;groupsDirty=true">' +
      '<input placeholder="' + esc(t('phGFilter')) + '" value="' + esc(g.filter) + '" oninput="groups[' + i + '].filter=this.value;groupsDirty=true;renderGroupCount(' + i + ')">' +
      '<button onclick="groups.splice(' + i + ',1);groupsDirty=true;renderGroups()">' + t('del') + '</button></div>' +
      '<div class="muted" id="gcnt' + i + '" style="margin-top:6px">' + t('matched') + ': ' + cnt + '</div></div>';
  }).join('') || '<div class="muted">' + t('noGroups') + '</div>';
}
function renderGroupCount(i) {
  const g = groups[i], nodes = (S && S.nodes) || [];
  let cnt; try { const re = new RegExp(g.filter.replace(/^\(\?i\)/, ''), g.filter.startsWith('(?i)') ? 'i' : ''); cnt = nodes.filter(n => re.test(n.name)).length; } catch (e) { cnt = '?'; }
  $('gcnt' + i).textContent = t('matched') + ': ' + cnt;
}
function addGroup() { groups.push({id: '', name: '', filter: ''}); groupsDirty = true; renderGroups(); }
async function saveGroups() {
  $('gsave').disabled = true; setMsg('gmsg', 'muted', t('applying'));
  try {
    await post('/api/groups', JSON.stringify(groups));
    groupsDirty = false; setMsg('gmsg', 'ok', t('applied'));
  } catch (e) { setMsg('gmsg', 'bad', e.message); }
  $('gsave').disabled = false; await load();
}

// ---------- проверка сайта ----------
async function checkRoute() {
  const q = $('rq').value.trim(); if (!q) return;
  $('rres').innerHTML = '…';
  try {
    const r = await (await fetch('/api/route?q=' + encodeURIComponent(q))).json();
    const cls = r.route === 'direct' ? 'muted' : 'ok';
    let h = '<div class="card"><div class="muted">' + esc(r.input) + '</div><div class="big ' + cls + '">' + esc(r.target) + '</div>';
    if (r.list) h += '<div>' + t('rList') + ': ' + esc(r.list) + '</div>';
    if (r.rule) h += '<div>' + t('rRule') + ': <code>' + esc(r.rule) + '</code></div>';
    if (r.via) h += '<div>' + t('rVia') + ': <b>' + esc(r.via) + '</b></div>';
    (r.notes || []).forEach(n => h += '<div class="muted" style="margin-top:4px">' + esc(n) + '</div>');
    $('rres').innerHTML = h + '</div>';
  } catch (e) { $('rres').innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; }
}

// ---------- настройки ----------
let SET = null;
async function loadSettings() {
  try { SET = await (await fetch('/api/settings')).json(); } catch (e) { return; }
  const s = SET.settings, w = s.watchdog, tg = s.telegram;
  const v = (id, x) => $(id).value = x ?? '', c = (id, x) => $(id).checked = !!x;
  v('s_sub_interval_hours', s.sub_interval_hours); v('s_user_agent', s.user_agent); v('s_max_nodes', s.max_nodes);
  c('s_w_enabled', w.enabled); v('s_w_interval_sec', w.interval_sec); v('s_w_fails_to_switch', w.fails_to_switch); v('s_w_switch_faster_ms', w.switch_faster_ms);
  v('s_w_background_cycle_min', w.background_cycle_min); v('s_w_test_kb', Math.round((w.test_bytes || 32768) / 1024)); c('s_w_restart_xray', w.restart_xray); v('s_w_check_urls', (w.check_urls || []).join('\n'));
  v('s_tg_token', tg.token); v('s_tg_chat_id', tg.chat_id); v('s_tg_expire_days', tg.expire_days); v('s_tg_traffic_pct', tg.traffic_pct);
  c('s_tg_on_switch', tg.on_switch); c('s_tg_on_update', tg.on_update);
  v('s_password', ''); c('s_ui_allow_wan', s.ui_allow_wan);
  const lf = $('s_log_file'); if (![...lf.options].some(o => o.value === s.log_file)) lf.add(new Option(s.log_file, s.log_file)); v('s_log_file', s.log_file);
  updView();
}
// кнопка «Обновить» доступна, только если на GitHub есть версия новее установленной.
// В серверном режиме (Docker) xsub обновляется новым образом контейнера —
// кнопок нет, версия показывается для сведения.
function updView() {
  const cur = (S && S.version) || '', latest = (S && S.latest) || '', newer = latest && newerThan(cur, latest);
  $('uver').textContent = t('curVer') + ': ' + cur + (newer ? ' · ' + t('newVer') + ': ' + latest : latest ? ' · ' + t('upToDate') : '');
  if (S && S.server) {
    $('updCheckBtn').style.display = 'none';
    $('updBtn').style.display = 'none';
    if (newer) $('uver').textContent += ' · ' + t('updDocker');
    return;
  }
  $('updBtn').disabled = !newer;
  $('updBtn').title = newer ? '' : t(latest ? 'upToDate' : 'updUnknown');
}
function collectSettings() {
  const n = id => parseInt($(id).value, 10) || 0, v = id => $(id).value, c = id => $(id).checked;
  return {
    password: v('s_password'), sub_interval_hours: n('s_sub_interval_hours'), user_agent: v('s_user_agent'), max_nodes: n('s_max_nodes'),
    log_file: v('s_log_file'), ui_allow_wan: c('s_ui_allow_wan'),
    watchdog: {enabled: c('s_w_enabled'), interval_sec: n('s_w_interval_sec'), fails_to_switch: n('s_w_fails_to_switch'), switch_faster_ms: n('s_w_switch_faster_ms'),
      background_cycle_min: n('s_w_background_cycle_min'), test_bytes: n('s_w_test_kb') * 1024, restart_xray: c('s_w_restart_xray'),
      check_urls: v('s_w_check_urls').split('\n').map(x => x.trim()).filter(Boolean)},
    telegram: {token: v('s_tg_token'), chat_id: v('s_tg_chat_id'), expire_days: n('s_tg_expire_days'), traffic_pct: n('s_tg_traffic_pct'),
      on_switch: c('s_tg_on_switch'), on_update: c('s_tg_on_update')}
  };
}
async function saveSettings() {
  $('setsave').disabled = true; setMsg('setmsg', 'muted', t('saving'));
  try { await post('/api/settings', JSON.stringify(collectSettings())); setMsg('setmsg', 'ok', t('restarting')); setTimeout(() => location.reload(), 4000); }
  catch (e) { setMsg('setmsg', 'bad', e.message); $('setsave').disabled = false; }
}
async function tgTest() {
  setMsg('tgmsg', 'muted', '…');
  try { await post('/api/telegram/test'); setMsg('tgmsg', 'ok', t('done')); } catch (e) { setMsg('tgmsg', 'bad', e.message); }
}
async function restore(inp) {
  const f = inp.files[0]; if (!f) return;
  setMsg('bmsg', 'muted', t('restoring'));
  try { await post('/api/restore', await f.text()); setMsg('bmsg', 'ok', t('restarting')); setTimeout(() => location.reload(), 4000); }
  catch (e) { setMsg('bmsg', 'bad', e.message); }
  inp.value = '';
}
async function updCheck() {
  $('uver').textContent = '…';
  try {
    const r = await post('/api/update/check');
    if (S) { S.latest = r.latest; render(); }
    updView();
  } catch (e) { $('uver').textContent = e.message; }
}
async function doUpdate() {
  if (!confirm(t('updConfirm'))) return;
  $('updBtn').disabled = true;
  try {
    await post('/api/update');
    $('ulog').textContent = t('updStarted');
    const iv = setInterval(async () => {
      try { const l = await (await fetch('/api/update/log')).text(); if (l) $('ulog').textContent = l; } catch (e) {}
    }, 2000);
    setTimeout(() => { clearInterval(iv); location.reload(); }, 60000);
  } catch (e) { $('ulog').textContent = e.message; $('updBtn').disabled = false; }
}

(async () => {
  applyI18n(); tab('overview');
  await load();
  try { subs = await (await fetch('/api/subs')).json() || []; } catch (e) {}
  renderSubs();
  await loadFbs();
  loadDiag(); setInterval(loadDiag, 300000);
  await fetchList('vpn'); showList(); renderListTabs();
  // Вкладку со страницей часто оставляют открытой на неделю, а каждый опрос — это
  // работа на роутере. В скрытой вкладке опрос не нужен, при возврате обновляем сразу.
  setInterval(() => { if (!document.hidden) load(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
